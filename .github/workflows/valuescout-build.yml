# ValueScout fork: builds two Chrome extension zips for every PR into `valuescout` (as a workflow
# artifact) and, on each merge, publishes them as a GitHub release:
# - valuescout-mimik-<sha>.zip, the tester build with the fixed extension id (install unpacked);
# - valuescout-show-me-store-<sha>.zip, the Chrome Web Store build (own name and icons, no key).
name: ValueScout build

on:
  pull_request:
    branches:
      - valuescout
  push:
    branches:
      - valuescout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Chrome
        run: pnpm build

      - name: Zip
        run: |
          cd apps/extension/.output/chrome-mv3
          zip -qr "$GITHUB_WORKSPACE/valuescout-mimik-${GITHUB_SHA::7}.zip" .

      - name: Build Chrome Web Store package
        env:
          VALUESCOUT_STORE: "1"
        run: pnpm build

      - name: Check the store package's locale keys
        # Chrome refuses to load an extension whose message keys aren't plain identifiers.
        run: |
          node -e '
            const fs = require("fs");
            const dir = "apps/extension/.output/chrome-mv3/_locales";
            const bad = fs.readdirSync(dir).flatMap((l) =>
              Object.keys(JSON.parse(fs.readFileSync(`${dir}/${l}/messages.json`, "utf8")))
                .filter((k) => !/^[A-Za-z0-9_]+$/.test(k)).map((k) => `${l}: ${k}`));
            if (bad.length) { console.error("Invalid message keys:\n" + bad.join("\n")); process.exit(1); }
          '

      - name: Zip store package
        run: |
          cd apps/extension/.output/chrome-mv3
          zip -qr "$GITHUB_WORKSPACE/valuescout-show-me-store-${GITHUB_SHA::7}.zip" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valuescout-mimik
          path: valuescout-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: valuescout-mimik

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          gh release create "valuescout-$short" valuescout-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ValueScout build $short" \
            --notes "Built from \`valuescout\` at $short. Testers: install \`valuescout-mimik-$short.zip\` (steps: https://github.com/$GITHUB_REPOSITORY/blob/valuescout/VALUESCOUT.md). Chrome Web Store: upload \`valuescout-show-me-store-$short.zip\` (listing: https://github.com/$GITHUB_REPOSITORY/blob/valuescout/store/LISTING.md)." \
            --latest
